[project]
name = "palimpsest"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "diskcache>=5.6.3",
    "hydradb-sdk>=2.1.2",
    "json-repair>=0.63.2",
    "litellm>=1.97.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "tenacity>=9.1.4",
    "typer>=0.27.1",
]

[project.scripts]
palimpsest = "palimpsest.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palimpsest"]
